services:
  spring-app:
    environment:
      APP_CORS_ALLOWED_ORIGINS: https://84.8.135.181:8080

  frontend:
    volumes:
      - ./frontend/nginx.https.conf:/etc/nginx/conf.d/default.conf:ro
      - certificate_data:/etc/letsencrypt:ro

  certbot:
    image: ${CERTBOT_IMAGE:-ghcr.io/mastermind1632/agritech-certbot:latest}
    profiles: [maintenance]
    volumes:
      - certificate_data:/etc/letsencrypt
      - certificate_logs:/var/log/letsencrypt
      # Trusted, short-lived maintenance only; never exposed as an HTTP service.
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  certificate_data:
    name: agritech-ip-certificates
  certificate_logs:
