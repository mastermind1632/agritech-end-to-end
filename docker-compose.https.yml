services:
  spring-app:
    environment:
      APP_CORS_ALLOWED_ORIGINS: https://84.8.135.181

  frontend:
    volumes:
      - ./frontend/nginx.https.conf:/etc/nginx/conf.d/default.conf:ro

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    environment:
      HTTPS_UPSTREAM: ${HTTPS_UPSTREAM:-frontend:80}
    ports:
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  caddy_data:
  caddy_config:
