server {
  listen 80;
  server_name _;
  client_max_body_size 3m;
  root /usr/share/nginx/html;
  index index.html;
  # Re-resolve the backend when Docker recreates its container with a new IP.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $spring_backend http://spring-app:8080;
  location /api/ {
    proxy_read_timeout 240s;
    proxy_pass $spring_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /actuator/ { proxy_pass $spring_backend; proxy_set_header Host $host; }
  location / { try_files $uri $uri/ /index.html; }
}
