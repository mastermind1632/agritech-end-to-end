# Public legacy port: redirect to the authenticated, encrypted site.
server {
  listen 80;
  server_name _;
  return 308 https://84.8.135.181$request_uri;
}

# Docker-network-only upstream for Caddy. This port is not published on the host.
server {
  listen 8081;
  server_name _;
  client_max_body_size 3m;
  root /usr/share/nginx/html;
  index index.html;
  location /api/ {
    proxy_read_timeout 240s;
    proxy_pass http://spring-app:8080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
  location /actuator/ {
    proxy_pass http://spring-app:8080/actuator/;
    proxy_set_header Host $host;
  }
  location / { try_files $uri $uri/ /index.html; }
}
