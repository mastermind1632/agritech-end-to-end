server {
  listen 80 ssl;
  server_name _;
  ssl_certificate /etc/letsencrypt/live/84.8.135.181/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/84.8.135.181/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:TLS:10m;
  ssl_session_timeout 1d;
  error_page 497 =308 https://84.8.135.181:8080$request_uri;
  add_header Strict-Transport-Security "max-age=86400" always;
  client_max_body_size 12m;
  root /usr/share/nginx/html;
  index index.html;
  # Live notifications (Server-Sent Events): no buffering, long-lived connection.
  location /api/live/stream {
    proxy_pass http://spring-app:8080/api/live/stream;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }
  # The service worker must always be revalidated so app updates reach users.
  location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location /api/ {
    proxy_read_timeout 240s;
    proxy_pass http://spring-app:8080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
  location /actuator/ {
    proxy_pass http://spring-app:8080/actuator/;
    proxy_set_header Host $host;
  }
  location / { try_files $uri $uri/ /index.html; }
}
