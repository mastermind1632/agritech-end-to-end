name: Provision Production HTTPS

on:
  push:
    branches: [ops/https-bootstrap]
    paths:
      - .github/workflows/https-bootstrap.yml
      - docker-compose.https.yml
      - gateway/Caddyfile
      - frontend/nginx.https.conf
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agritech-production-https
  cancel-in-progress: false

jobs:
  https:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate HTTPS configuration
        run: docker run --rm -v "$PWD/gateway/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11.7-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Copy gateway configuration only
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.https.yml,gateway/Caddyfile,frontend/nginx.https.conf"
          target: "~/agritech-end-to-end"
      - name: Provision HTTPS without replacing existing application containers
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 12m
          script: |
            set -eu
            cd ~/agritech-end-to-end
            docker compose --env-file .env -f docker-compose.prod.yml -f docker-compose.https.yml config --quiet
            docker compose --env-file .env -f docker-compose.prod.yml -f docker-compose.https.yml pull caddy
            docker compose --env-file .env -f docker-compose.prod.yml -f docker-compose.https.yml up -d --no-deps caddy
            for attempt in $(seq 1 20); do
              if curl --fail --silent --show-error --max-time 15 --resolve 84.8.135.181:443:127.0.0.1 https://84.8.135.181/actuator/health; then
                echo 'Trusted IP certificate and HTTPS upstream verified.'
                exit 0
              fi
              echo "Waiting for IP certificate (attempt $attempt)"
              sleep 20
            done
            docker compose --env-file .env -f docker-compose.prod.yml -f docker-compose.https.yml logs --tail=60 caddy
            exit 1
      - name: Verify public HTTPS reachability
        run: curl --retry 5 --retry-all-errors --connect-timeout 15 --max-time 45 --fail --silent --show-error https://84.8.135.181/actuator/health
