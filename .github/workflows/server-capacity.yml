name: Production Capacity Maintenance

on:
  push:
    branches: [ops/server-capacity]
    paths: [.github/workflows/server-capacity.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect production without changing services or data
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -eu
            date -u
            uname -m
            df -h /
            df -i /
            free -h
            docker system df
            docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Ports}}'
            docker image ls --format 'table {{.Repository}}\t{{.Tag}}\t{{.ID}}\t{{.Size}}' | head -70
            ss -lnt | grep -E ':(80|443|8080)\b' || true
            docker exec agritech_lema_frontend nginx -T 2>&1 | grep -E 'root |try_files|well-known|location.*\\.' || true
            if sudo -n true 2>/dev/null; then
              sudo iptables -S INPUT
            fi
      - name: Reclaim old disposable image layers and build cache
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -eu
            # Untagged, unused images only. Running/stopped-container images and tagged rollback releases are retained.
            docker image prune --force --filter 'until=24h'
            docker builder prune --force --filter 'until=24h'
            df -h /
            docker system df
            curl --fail --silent --show-error http://127.0.0.1:8080/actuator/health
