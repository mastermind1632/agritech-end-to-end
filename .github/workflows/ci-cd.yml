name: AgriFinance CI/CD

on:
  push:
    branches: [main, feature/lema-ai-services]
  pull_request:
    branches: [main]

concurrency:
  group: agritech-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B clean verify

  publish:
    needs: [test, langchain-test, segmentation-test, certificate-test, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase owner (GHCR requires lowercase)
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/agritech-api:latest
            ghcr.io/${{ env.OWNER }}/agritech-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/agritech-web:latest
            ghcr.io/${{ env.OWNER }}/agritech-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - uses: docker/build-push-action@v6
        with:
          context: ./langchain-service
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/agritech-langchain:latest
            ghcr.io/${{ env.OWNER }}/agritech-langchain:${{ github.sha }}
          cache-from: type=gha,scope=langchain
          cache-to: type=gha,mode=max,scope=langchain

      - name: Publish CPU-only Ollama runtime
        uses: docker/build-push-action@v6
        with:
          context: ./ollama-service
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/agritech-ollama-cpu:latest
            ghcr.io/${{ env.OWNER }}/agritech-ollama-cpu:${{ github.sha }}
          cache-from: type=gha,scope=ollama-cpu
          cache-to: type=gha,mode=max,scope=ollama-cpu

      - name: Publish market intelligence
        uses: docker/build-push-action@v6
        with:
          context: ./segmentation-service
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/agritech-segmentation:latest
            ghcr.io/${{ env.OWNER }}/agritech-segmentation:${{ github.sha }}
          cache-from: type=gha,scope=segmentation
          cache-to: type=gha,mode=max,scope=segmentation

      - name: Publish certificate maintenance image
        uses: docker/build-push-action@v6
        with:
          context: ./certificate-service
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/agritech-certbot:latest
            ghcr.io/${{ env.OWNER }}/agritech-certbot:${{ github.sha }}
          cache-from: type=gha,scope=certbot
          cache-to: type=gha,mode=max,scope=certbot

      - name: Verify segmentation image starts with PostgreSQL
        run: |
          docker network create segmentation-smoke
          docker run -d --name segmentation-db --network segmentation-smoke -e POSTGRES_PASSWORD=smoke-only-password -e POSTGRES_DB=segmentation_test postgres:17-alpine
          trap 'docker rm -f segmentation-api segmentation-db; docker network rm segmentation-smoke' EXIT
          for attempt in $(seq 1 30); do
            if docker exec segmentation-db pg_isready -U postgres -d segmentation_test; then break; fi
            sleep 2
          done
          docker exec -e PGPASSWORD=smoke-only-password segmentation-db psql -U postgres -d segmentation_test -c 'CREATE TABLE farmers(id varchar(36) PRIMARY KEY);'
          docker run -d --name segmentation-api --network segmentation-smoke -p 127.0.0.1:8002:8002 \
            -e PGHOST=segmentation-db -e PGDATABASE=segmentation_test -e PGPASSWORD=smoke-only-password \
            ghcr.io/${{ env.OWNER }}/agritech-segmentation:${{ github.sha }}
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8002/health; then break; fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:8002/health

      - name: Verify CPU-only model generation
        env:
          OLLAMA_IMAGE: ghcr.io/${{ env.OWNER }}/agritech-ollama-cpu:${{ github.sha }}
        run: |
          docker run -d --name ollama-cpu-smoke -p 127.0.0.1:11434:11434 "$OLLAMA_IMAGE"
          trap 'docker rm -f ollama-cpu-smoke' EXIT
          for attempt in $(seq 1 30); do
            if docker exec ollama-cpu-smoke ollama list; then break; fi
            echo "Waiting for Ollama (attempt $attempt)"
            sleep 2
          done
          docker exec ollama-cpu-smoke ollama pull qwen2.5:0.5b
          python - <<'PY'
          import json
          from urllib.request import Request, urlopen
          body = {"model": "qwen2.5:0.5b", "prompt": "What should I check before buying crop seeds?",
                  "stream": False, "options": {"num_predict": 40}}
          request = Request("http://127.0.0.1:11434/api/generate", data=json.dumps(body).encode(),
                            headers={"Content-Type": "application/json"})
          with urlopen(request, timeout=180) as response:
              assert json.load(response)["response"].strip(), "CPU-only runtime returned an empty answer"
          print("CPU-only Qwen generation passed.")
          PY

  langchain-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: langchain-service/requirements.txt
      - run: python -m pip install -r langchain-service/requirements.txt
      - run: python -m unittest discover -s tests -v
        working-directory: langchain-service

  segmentation-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: segmentation_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d segmentation_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: test-only-password
      PGDATABASE: segmentation_test
      SEGMENTATION_TEST_DATABASE: 'true'
      MODEL_DIR: /tmp/agritech-test-models
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: segmentation-service/requirements.txt
      - run: python -m pip install -r segmentation-service/requirements.txt
      - run: python -m unittest discover -s tests -v
        working-directory: segmentation-service

  certificate-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install docker==7.1.0
      - run: python -m unittest discover -s certificate-service/tests -v

  frontend-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm test
        working-directory: frontend
  deploy:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Preserve rollback configuration and back up PostgreSQL
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -eu
            cd ~/agritech-end-to-end
            backup='.releases/${{ github.sha }}'
            mkdir -p "$backup"
            chmod 700 .releases "$backup"
            for file in .env docker-compose.prod.yml docker-compose.ai.yml docker-compose.segmentation.yml docker-compose.https.yml; do
              if [ -f "$file" ]; then cp -p "$file" "$backup/$file"; fi
            done
            docker compose --env-file .env -f docker-compose.prod.yml exec -T postgres pg_dump -U postgres -d agritech -Fc > "$backup/agritech.dump"
            chmod 600 "$backup/agritech.dump"
            test -s "$backup/agritech.dump"
            echo 'Current release configuration and database backup are preserved.'

      - name: Generate .env file locally
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          APP_JWT_SECRET: ${{ secrets.APP_JWT_SECRET }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          values = {
              "DOCKER_REGISTRY_OWNER": os.environ["GITHUB_REPOSITORY_OWNER"].lower(),
              "IMAGE_TAG": os.environ["GITHUB_SHA"],
              "AI_IMAGE_TAG": os.environ["GITHUB_SHA"],
              "OLLAMA_IMAGE": "ghcr.io/" + os.environ["GITHUB_REPOSITORY_OWNER"].lower() + "/agritech-ollama-cpu:" + os.environ["GITHUB_SHA"],
              "POSTGRES_PASSWORD": os.environ["POSTGRES_PASSWORD"],
              "APP_JWT_SECRET": os.environ["APP_JWT_SECRET"],
              "AI_MODEL": "qwen2.5:0.5b",
              "AI_LANGSMITH_TRACING": "false",
              "CERTBOT_IMAGE": "ghcr.io/" + os.environ["GITHUB_REPOSITORY_OWNER"].lower() + "/agritech-certbot:" + os.environ["GITHUB_SHA"],
          }
          assert values["POSTGRES_PASSWORD"], "POSTGRES_PASSWORD is required"
          assert len(values["APP_JWT_SECRET"]) >= 32, "APP_JWT_SECRET must have at least 32 characters"
          assert all("\n" not in value and "\r" not in value for value in values.values()), "Environment values must be single-line"
          def quoted(value):
              return "'" + value.replace("'", "\\'") + "'"
          Path(".env").write_text("".join(key + "=" + quoted(value) + "\n" for key, value in values.items()))
          Path(".env").chmod(0o600)
          PY

      - name: Copy production files and .env to OCI Server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.prod.yml,docker-compose.ai.yml,docker-compose.segmentation.yml,docker-compose.https.yml,frontend/nginx.https.conf,scripts/deploy-production.sh,scripts/renew-certificate.sh,scripts/install-certificate-renewal.sh,scripts/certificate-renewal.cron,.env"
          target: "~/agritech-end-to-end"

      - name: Deploy via SSH & Docker Compose
        uses: appleboy/ssh-action@v1
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          DOCKER_REGISTRY_OWNER: ${{ github.repository_owner }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_HTTPS: 'false'
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_PAT,DOCKER_REGISTRY_OWNER,RELEASE_SHA,RELEASE_HTTPS
          command_timeout: 30m
          script: |
            set -eu
            cd ~/agritech-end-to-end
            sh scripts/deploy-production.sh

      - name: Verify public HTTP test release
        run: |
          curl --retry 3 --retry-all-errors --connect-timeout 15 --max-time 45 --fail --silent --show-error http://84.8.135.181:8080/actuator/health
