fao-water.content=Crop irrigation water requirements depend on climate, crop type and growth stage. Hot, dry, windy and sunny conditions increase water needs relative to cool, humid and cloudy conditions. Local climatic measurements and crop stage are needed to estimate requirements. This summary does not provide a field-specific watering schedule. Ask about the crop, stage, location, soil and available water; do not invent rainfall or exact irrigation rates.
fao-conservation.title=FAO: Conservation agriculture and crop diversification
fao-conservation.url=https://www.fao.org/conservation-agriculture/en
fao-conservation.publisher=Food and Agriculture Organization of the United Nations
fao-conservation.region=Global principles; check local South African field conditions
fao-conservation.checkedOn=2026-10-08
fao-conservation.publicationDate=Not stated on source page
fao-conservation.content=Conservation agriculture combines limited mechanical soil disturbance, maintaining soil cover and diversifying plant species. Crop rotation and varied crop sequences are part of diversification. These are general principles, not a prescription for a particular farm. Ask about previous crops, local conditions and available water before discussing an appropriate rotation. Do not guarantee yields or profit.
