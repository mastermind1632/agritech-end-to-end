spring.application.name=AgriTech Command Center

# Database (every value has a local default and can be overridden by an env variable)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/agritech}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# Schema is owned by Flyway (src/main/resources/db/migration). Hibernate only checks that entities match it.
# Existing databases created by the old ddl-auto=update are baselined at V1 and receive V2+ automatically.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# JWT (secret must be at least 32 characters)
app.security.jwt-secret=${APP_JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}
# Access tokens are short-lived; the app renews them silently with a rotating refresh token.
app.security.jwt-expiration-seconds=${APP_JWT_EXPIRATION_SECONDS:1800}
app.security.refresh-token-days=${APP_REFRESH_TOKEN_DAYS:14}

# CORS (only needed if the browser calls the API directly instead of through the /api proxy)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Uploads: photos are limited to 2 MB, vault documents to 8 MB and bank statements to 10 MB by each controller.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Grounded farming assistant. Ollama and LangChain are internal services.
ai.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ai.langchain-url=${AI_LANGCHAIN_URL:http://localhost:8001}
ai.model=${AI_MODEL:qwen2.5:0.5b}
ai.segmentation-url=${AI_SEGMENTATION_URL:http://localhost:8002}

# ---------------------------------------------------------------- platform
# Public address of the web app, used in password-reset links.
app.public-url=${APP_PUBLIC_URL:http://localhost:5173}
# Development only: also return the password-reset link in the API response and log it (no email/SMS needed).
app.auth.dev-show-reset-link=${APP_DEV_SHOW_RESET_LINK:false}
# First administrator (created or promoted at start-up). Leave empty to skip.
app.bootstrap.admin-contact=${APP_ADMIN_CONTACT:}
app.bootstrap.admin-password=${APP_ADMIN_PASSWORD:}
# Demo accounts and data for presentations. Never enable on a database with real users.
app.demo.seed=${APP_DEMO_SEED:false}
# Document vault encryption key: 32 random bytes, base64 (openssl rand -base64 32). Empty = derived from the JWT secret.
app.vault.key=${APP_VAULT_KEY:}

# Notifications. Each channel switches on when configured.
# Email: set SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME and SPRING_MAIL_PASSWORD as environment
# variables (Spring reads them directly; they are deliberately not listed here so email stays off until set).
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS:true}
app.mail.from=${APP_MAIL_FROM:no-reply@agritech.local}
app.sms.africastalking.username=${AFRICASTALKING_USERNAME:}
app.sms.africastalking.api-key=${AFRICASTALKING_API_KEY:}
app.sms.africastalking.sender-id=${AFRICASTALKING_SENDER_ID:}
app.sms.africastalking.url=${AFRICASTALKING_URL:https://api.africastalking.com/version1/messaging}
app.whatsapp.token=${WHATSAPP_TOKEN:}
app.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}

# Business companion: compulsory VAT registration threshold in rand (check SARS for the current value).
app.companion.vat-threshold=${APP_VAT_THRESHOLD:1000000}

# Expense analysis: PDF / photo reading service, and the optional self-hosted AI fallback for categories.
app.document-service.url=${DOCUMENT_SERVICE_URL:http://localhost:8003}
app.statements.ai-categorise=${APP_STATEMENTS_AI:false}

# Export readiness: watch official source pages for changes (needs outbound internet access).
app.export.monitor.enabled=${APP_EXPORT_MONITOR_ENABLED:false}

# API documentation at /swagger-ui.html (set SPRINGDOC_ENABLED=false to hide it in production).
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:true}
springdoc.swagger-ui.operations-sorter=alpha

# Health details for the admin, and graceful shutdown.
management.endpoints.web.exposure.include=health,info,metrics
# An unreachable SMTP server must not mark the whole API as DOWN (deploy checks rely on /actuator/health).
management.health.mail.enabled=false
server.shutdown=graceful
