services:
  postgres:
    image: postgres:18-alpine
    container_name: agritech-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-agritech}
    ports:
      # bound to localhost only, so the database is not exposed to your network
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18+ images keep data in a versioned sub-folder, so the volume
      # must be mounted at /var/lib/postgresql (NOT /var/lib/postgresql/data).
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-agritech}"]
      interval: 5s
      timeout: 5s
      retries: 10

  spring-app:
    build: .
    container_name: agritech-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-3000}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-agritech}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-change-this-to-a-long-random-production-secret-at-least-32-chars}
      # Flyway owns the schema; Hibernate only validates it.
      SPRING_JPA_DDL_AUTO: ${SPRING_JPA_DDL_AUTO:-validate}
      DOCUMENT_SERVICE_URL: http://document-service:8003
      APP_PUBLIC_URL: http://localhost:${FRONTEND_PORT:-3000}
      APP_VAULT_KEY: ${APP_VAULT_KEY:-}
      APP_ADMIN_CONTACT: ${APP_ADMIN_CONTACT:-}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
      # Local demos: fictional accounts and data, and reset links shown on screen instead of emailed.
      APP_DEMO_SEED: ${APP_DEMO_SEED:-false}
      APP_DEV_SHOW_RESET_LINK: ${APP_DEV_SHOW_RESET_LINK:-false}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      AFRICASTALKING_USERNAME: ${AFRICASTALKING_USERNAME:-}
      AFRICASTALKING_API_KEY: ${AFRICASTALKING_API_KEY:-}

  # Reads PDF statements (text layer) and scans/photos (Tesseract OCR). Internal only; nothing is stored.
  document-service:
    build: ./document-service
    container_name: agritech-documents
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: agritech-web
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - spring-app

volumes:
  postgres_data:
