services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-default_postgres_password}
      POSTGRES_DB: agritech
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agritech"]
      interval: 5s
      timeout: 5s
      retries: 10

  spring-app:
    image: ghcr.io/${DOCKER_REGISTRY_OWNER:-mastermind1632}/agritech-api:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/agritech
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-default_postgres_password}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-default_temp_jwt_secret}

  frontend:
    image: ghcr.io/${DOCKER_REGISTRY_OWNER:-mastermind1632}/agritech-web:latest
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - spring-app

volumes:
  postgres_data:
