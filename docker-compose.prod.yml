services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: agritech
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agritech"]
      interval: 5s
      timeout: 5s
      retries: 10

  spring-app:
    image: ghcr.io/${DOCKER_REGISTRY_OWNER:-mastermind1632}/agritech-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/agritech
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?set APP_JWT_SECRET in .env}
      APP_CORS_ALLOWED_ORIGINS: http://84.8.135.181:8080
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://84.8.135.181:8080}
      DOCUMENT_SERVICE_URL: http://document-service:8003
      APP_VAULT_KEY: ${APP_VAULT_KEY:-}
      APP_ADMIN_CONTACT: ${APP_ADMIN_CONTACT:-}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
      SPRINGDOC_ENABLED: ${SPRINGDOC_ENABLED:-false}

  document-service:
    image: ghcr.io/${DOCKER_REGISTRY_OWNER:-mastermind1632}/agritech-documents:${IMAGE_TAG:-latest}
    restart: unless-stopped
    mem_limit: 768m

  frontend:
    image: ghcr.io/${DOCKER_REGISTRY_OWNER:-mastermind1632}/agritech-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - spring-app

volumes:
  postgres_data:
